name: cafein
description: "카페 종사자 익명 커뮤니티 카페인"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  kakao_flutter_sdk: ^1.9.5
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.3
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.8
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/cafeinlogo.png

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/cafeinlogo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/cafeinlogo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/cafeinlogo.png
  android: true
  ios: true
  web: false
  # Android 12+ uses a separate splash API (ignores classic launch_background alone)
  android_12:
    color: "#FFFFFF"
    image: assets/images/cafeinlogo.png
  fullscreen: false
